<style>

:root[data-theme="dark"]{--bg:#0d1117;--card:#161c24;--tx:#e6ebf1;--mu:#93a1b3;--bd:#2b3644;--ac:#5aa9ff;--ac2:#ff8f5a;--ok:#69db7c;--w:#4dabf7}

header{padding:10px 16px 0;background:var(--card);border-bottom:1px solid var(--bd)}h1{font-size:18px;margin:0 0 8px}
nav{display:flex;gap:4px;overflow-x:auto}nav button{border:0;background:none;color:var(--mu);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}

@media(max-width:800px){main{grid-template-columns:1fr}}

.gauge{text-align:center}.gauge svg{width:100%;max-width:170px}.gauge small{color:var(--mu);display:block}
svg text{fill:var(--tx);font-family:inherit}.mu{fill:var(--mu)!important}
.flow{stroke:var(--w);stroke-width:3;stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}
.node{cursor:pointer}.node rect{fill:var(--card);stroke:var(--ac);stroke-width:1.5}.node:hover rect{fill:var(--bg)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:4px 7px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu)}

.formula-card{border:1px solid var(--ac);border-left:5px solid var(--ac);background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:12px}.formula-card h2{font-size:14px;margin-bottom:8px}.formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.formula-item{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}.formula-item b{display:block;color:var(--ac);font-size:12px;margin-bottom:4px}.formula-eq{font:600 14px/1.6 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.formula-sub{font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--mu);margin-top:4px}.machine-anim{display:flex;align-items:center;gap:14px;min-height:130px}.machine-anim svg{width:min(100%,190px);height:120px;flex:0 0 190px}.machine-anim p{color:var(--mu);font-size:12px;margin:0}.machine-anim strong{color:var(--tx)}.spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}.spin-slow{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}.pulse{animation:pulse 1.8s ease-in-out infinite}.wave{stroke-dasharray:7 6;animation:fl 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes syncCW{to{transform:rotate(360deg)}}@keyframes syncCCW{to{transform:rotate(-360deg)}}@media(prefers-reduced-motion:reduce){.spin,.spin-slow,.pulse,.wave,.flow{animation:none!important}}@media(max-width:520px){.machine-anim{align-items:flex-start;gap:8px}.machine-anim svg{width:120px;flex-basis:120px}.formula-eq{font-size:12px}}

.family-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.family-grid label{display:block;color:var(--mu);font-size:12px}.family-grid select,.instrument-head select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;margin-top:5px}.instrument-card{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--card)}.instrument-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.instrument-head select{max-width:270px}.instrument-screen{background:#07131b;color:#c7f9e9;border-radius:8px;padding:10px;margin-top:10px;overflow:hidden}.instrument-screen svg{width:100%;height:auto;display:block}.instrument-screen text{fill:#c7f9e9}.instrument-readings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:9px}.instrument-readings div{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px}.instrument-readings b{display:block;font-size:17px;color:var(--ac)}.instrument-readings small{color:var(--mu)}.selector-note{font-size:12px;color:var(--mu);margin:8px 0 0}.instrument-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.instrument-tabs button{border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);padding:6px 9px;cursor:pointer}.instrument-tabs button.active{border-color:var(--ac);color:var(--ac);font-weight:700}.scope-grid{stroke:#31505d;stroke-width:1}.scope-wave{fill:none;stroke:#58e0b4;stroke-width:2}.scope-wave.b{stroke:#f4b860}.scope-wave.c{stroke:#73a9ff}.instrument-screen .dim{fill:#8ba6b0}.family-note{border-left:3px solid var(--ac);padding:8px 10px;background:var(--bg);margin-top:8px;font-size:12px}
</style></head><body>
<header><h1>⚡ Laboratorio virtual v3 · del río a la casa</h1><nav id="nav"></nav></header>
<main><aside id="ctl"></aside><section id="view"></section></main>
<script>
const P={Q:["Caudal del río Q (m³/s)",1,200,1,40],Qd:["Caudal de diseño Qd (m³/s)",10,200,1,40],H:["Salto neto H (m)",10,500,1,120],et:["Rend. máx. turbina",.8,.95,.01,.9],
eg:["Rend. generador",.9,.99,.005,.97],f:["Frecuencia (Hz)",50,60,10,60],p:["Polos",4,48,2,12],Vg:["Tensión generador (kV)",6.6,13.8,.1,10.5],pf:["cos φ",.7,1,.01,.9],
Vt:["Transmisión (kV)",66,500,1,220],L:["Longitud línea (km)",5,300,1,80],r:["r (Ω/km)",.03,.2,.01,.07],x:["x (Ω/km)",.3,.45,.01,.4],Vd:["Distribución (kV)",6,33,.1,13.2],
J:["Densidad J (A/mm²)",1.5,5,.1,3],B:["Inducción B (T)",1.2,1.8,.05,1.6],pcu:["Pérd. cobre nom. (%)",.3,1.2,.05,.6],pfe:["Pérd. hierro (%)",.05,.4,.01,.12],uk:["uk (%)",4,15,.5,10],
sh:["Demanda industrial (%)",0,100,5,60],kw:["kW por vivienda",.5,3,.1,1.2],em:["Rend. motor",.85,.97,.01,.93],mP:["Potencia nominal motor (kW)",50,10000,10,1500],mn:["Polos del motor",2,12,2,4],ms:["Deslizamiento nominal (%)",.5,6,.1,1.5],mL:["Carga del motor (% par nominal)",10,120,5,80],mV:["Tensión del motor (V)",220,6600,10,380],pn:["Velocidad de la bomba (rpm)",900,3600,50,1750],pH0:["Altura a caudal cero H0 (m)",20,300,5,60],pQm:["Caudal máx. a H=0 (L/s)",50,10000,50,5000],pHs:["Altura estática del sistema (m)",0,100,1,20],pHf:["Fricción a 100 L/s (m)",.1,50,.1,.2],bp:["Bombeo de apoyo (0 = apagado, 1 = activo)",0,1,1,1]};
const v={};for(const k in P)v[k]=P[k][4];
const TABS=[["gen","📊 Tablero general",["Q","H","Vt","L","sh"]],["tur","💧 Turbina",["Q","Qd","H","et"]],["alt","⚙️ Generador",["f","p","Vg","eg","pf"]],
["trf","🔼 Transformadores",["J","B","pcu","pfe","uk","Vt","Vd"]],["lin","〰️ Línea",["Vt","L","r","x"]],["car","🏠 Cargas",["sh","kw","em"]],["mot","🔄 Motor",["mP","mn","ms","mL","mV","f"]],["bom","🚰 Bomba",["pn","pH0","pQm","pHs","pHf","mV"]],["gui","📝 Guía de laboratorio",[]]];
let tab="gen";const equip={tur:"francis",alt:"sync",trf:"power",lin:"overhead",mot:"induction",bom:"apoyo",car:"residencial"};let instrument="multimeter";const rad=Math.sqrt(3),F=(x,n=2)=>x.toLocaleString("es-PE",{maximumFractionDigits:n,minimumFractionDigits:n});
function trafo(name,Pin,V1,V2,c1,c2,pf){const tk=TF(V1,V2),S=Pin/pf,Sn=S*1.15,ld=S/Sn,Pcu=tk[0]*v.pcu/100*Sn*ld*ld,Pfe=tk[1]*v.pfe/100*Sn,Pout=Pin-Pcu-Pfe,R=v.pcu/100,X=Math.sqrt(Math.max(v.uk**2/1e4-R*R,0)),
reg=(R*pf+X*Math.sqrt(1-pf*pf))*ld,Sk=Sn*1000,Et=.45*Math.sqrt(Sk),Ac=Et/(4.44*v.f*v.B);
const w=(V,c)=>{const I=Sk/(rad*V),Ip=c=="Δ"?I/rad:I,Vp=c=="Δ"?V*1000:V*1000/rad,A=Ip/v.J;return{V,c,I,Ip,N:Vp/Et,A,d:Math.sqrt(4*A/Math.PI),par:Math.ceil(A/7.07)}};
return{name,Pin,Pout,Pcu,Pfe,Sn,reg,Et,Ac,eta:Pout/Pin,a:w(V1,c1),b:w(V2,c2)}}
function M(o={}){const u={...v,...o},pk=u.bp?pum(u):{Q:0,Pin:0},Qb=(equip.bom==="apoyo"?pk.Q/1000:0),Qt=u.Q+Qb,Paux=pk.Pin/1000,q=Qt/u.Qd,etE=Math.max(.3,u.et*TK()[0]*(1-TK()[1]*(q-1)**2)),Ph=9.81*Qt*u.H/1000,Pm=Ph*etE,Pe=Pm*Math.min(.995,u.eg+AK().de),Sg=Pe/(AK().pf?Math.min(u.pf,AK().pf):u.pf),Ig=Sg/(rad*u.Vg),ns=120*u.f/u.p,nq=ns*Math.sqrt(Pm*1000)/u.H**1.25;
const T1=trafo("T1 elevador",Math.max(Pe-Paux*1000,.01),u.Vg,u.Vt,"Δ","Y",u.pf),R=u.r*u.L*LK().r,X=u.x*u.L*LK().x,I=T1.Pout/(rad*u.Vt*u.pf),Pl=3*I*I*R/1000,dV=rad*I*(R*u.pf+X*Math.sqrt(1-u.pf**2)),dVp=dV/(u.Vt*1000)*100,Pr=T1.Pout-Pl;
const T2=trafo("T2 reductor",Pr,u.Vt,u.Vd,"Y","Δ",u.pf),T3=trafo("T3 distribución",T2.Pout,u.Vd,.38,"Δ","Y",u.pf),Pf=T3.Pout,Pind=Pf*u.sh/100,Pcas=Pf-Pind;
return{u,Qt,Qb,Paux,q,etE,Ph,Pm,Pe,Sg,Ig,ns,nq,T1,T2,T3,I,Pl,dVp,Pr,Pf,Pind,Pcas,nh:Pcas/u.kw,Pmot:Pind*u.em,Vend:(1-T2.reg-T3.reg-dVp/100)*380,eff:Pf/Ph,type:nq<70?"Pelton":nq<400?"Francis":"Kaplan"}}
function gauge(val,max,lab,unit,col="var(--ac)",dec=1){const f=Math.min(Math.max(val/max,0),1);
return`<div class="gauge"><svg viewBox="0 0 120 80"><path d="M10 65A50 50 0 0 1 110 65" fill="none" stroke="var(--bd)" stroke-width="10" stroke-linecap="round"/><path d="M10 65A50 50 0 0 1 110 65" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${f*157.08} 157.08"/><text x="60" y="58" text-anchor="middle" font-size="17" font-weight="700">${F(val,dec)}</text><text x="60" y="74" text-anchor="middle" font-size="9" class="mu">${unit}</text></svg><small>${lab}</small></div>`}
function chart(xs,series,mk,xl,yl,w=520,h=210){const m={l:44,r:12,t:12,b:34},X0=Math.min(...xs),X1=Math.max(...xs);let all=series.flatMap(s=>s.ys);let y0=Math.min(...all,0),y1=Math.max(...all)*1.05;if(y1==y0)y1=y0+1;
const sx=x=>m.l+(x-X0)/(X1-X0||1)*(w-m.l-m.r),sy=y=>h-m.b-(y-y0)/(y1-y0)*(h-m.t-m.b);let s=`<svg viewBox="0 0 ${w} ${h}" width="100%">`;
for(let i=0;i<=4;i++){const y=y0+(y1-y0)*i/4;s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--bd)"/><text x="${m.l-5}" y="${sy(y)+4}" text-anchor="end" font-size="10" class="mu">${F(y,y1>20?0:2)}</text>`;
const x=X0+(X1-X0)*i/4;s+=`<text x="${sx(x)}" y="${h-m.b+14}" text-anchor="middle" font-size="10" class="mu">${F(x,X1>20?0:2)}</text>`}
series.forEach(se=>{s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2.2" points="${xs.map((x,i)=>sx(x)+","+sy(se.ys[i])).join(" ")}"/>`;});
if(mk)s+=`<line x1="${sx(mk[0])}" x2="${sx(mk[0])}" y1="${m.t}" y2="${h-m.b}" stroke="var(--ac2)" stroke-dasharray="4 3"/><circle cx="${sx(mk[0])}" cy="${sy(mk[1])}" r="5" fill="var(--ac2)"/>`;
s+=`<text x="${(w+m.l)/2}" y="${h-4}" text-anchor="middle" font-size="11" class="mu">${xl}</text><text x="10" y="${m.t+4}" font-size="11" class="mu">${yl}</text></svg>`;
if(series.length>1)s+=`<div style="font-size:12px;color:var(--mu)">${series.map(z=>`<span style="color:${z.c}">●</span> ${z.n}`).join(" &nbsp; ")}</div>`;return s}
const rng=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
const C=(t,b)=>`<div class="card"><h2>${t}</h2>${b}</div>`;
function wcirc(T){const col=["var(--ac)","var(--ac2)"];let s=`<svg viewBox="0 0 480 120" width="100%">`;
[[T.a,"Prim."],[T.b,"Sec."]].forEach(([w,l],j)=>{const cx=40+j*0,cy=0});
const items=[[T.a,"Primario"],[T.b,"Secundario"]];items.forEach(([w,l],j)=>{const r=Math.min(w.d*2.2,50),cx=100+j*240;s+=`<circle cx="${cx}" cy="58" r="${r}" fill="${col[j]}" opacity=".8"/><text x="${cx}" y="${58+r+16}" text-anchor="middle" font-size="11">${l}: Ø ${F(w.d,2)} mm · ${F(w.N,0)} esp.</text>`});return s+"</svg>"}
const R={
gen(m){const nodes=[["💧","Río",F(m.Ph/1000)+" MW","tur"],["🌀","Turbina",F(m.Pm/1000)+" MW","tur"],["⚙️","Generador",F(m.Pe/1000)+" MW","alt"],["🔼","T1",F(m.T1.Pout/1000)+" MW","trf"],["〰️","Línea",F(m.Pr/1000)+" MW","lin"],["🔽","T2 / T3",F(m.Pf/1000)+" MW","trf"],["🏠","Usuarios",F(m.Pf/1000)+" MW","car"]];
let d=`<svg viewBox="0 0 900 110" width="100%">`;nodes.forEach((n,i)=>{const x=8+i*127;if(i)d+=`<line class="flow" x1="${x-27}" x2="${x}" y1="45" y2="45"/>`;
d+=`<g class="node" onclick="go('${n[3]}')"><rect x="${x}" y="15" width="100" height="62" rx="8"/><text x="${x+50}" y="38" text-anchor="middle" font-size="18">${n[0]}</text><text x="${x+50}" y="55" text-anchor="middle" font-size="11" font-weight="600">${n[1]}</text><text x="${x+50}" y="70" text-anchor="middle" font-size="11" class="mu">${n[2]}</text></g>`});d+=`<text x="8" y="102" font-size="10" class="mu">Haga clic en una máquina para abrir su pestaña</text></svg>`;
const bars=[["Hidráulica",m.Ph],["Eje turbina",m.Pm],["Generador",m.Pe],["Salida T1",m.T1.Pout],["Tras línea",m.Pr],["Salida T2",m.T2.Pout],["Baja tensión",m.Pf]];
const wf=`<svg viewBox="0 0 520 190" width="100%">${bars.map((b,i)=>{const h=b[1]/m.Ph*130;return`<rect x="${14+i*72}" y="${150-h}" width="52" height="${h}" rx="3" fill="${i==6?"var(--ok)":"var(--ac)"}"/><text x="${40+i*72}" y="${144-h}" text-anchor="middle" font-size="10">${F(b[1],1)}</text><text x="${40+i*72}" y="168" text-anchor="middle" font-size="9" class="mu">${b[0]}</text>`}).join("")}</svg>`;
return C("Diagrama unifilar (animado)",d)+C("Instrumentos",`<div class="g">${gauge(m.Pf,m.Ph,"Potencia al usuario","MW","var(--ok)")}${gauge(m.eff*100,100,"Eficiencia río→usuario","%","var(--ok)")}${gauge(m.Vend,400,"Tensión final BT","V","var(--ac)",0)}${gauge(m.Pl/m.Pr*100,10,"Pérdida en línea","%","var(--ac2)")}</div>`)+C("Cascada de potencia (MW)",wf)+
C("Corriente en cada punto del sistema",cur(m))+(m.dVp>10?`<div class="card warn">⚠ Caída de tensión en la línea &gt; 10 %: suba la tensión de transmisión.</div>`:"")},
tur(m){const qs=rng(.3*v.Qd,1.3*v.Qd,40);const e=qs.map(q=>Math.max(.3,v.et*TK()[0]*(1-TK()[1]*(q/v.Qd-1)**2))*100),p=qs.map(q=>9.81*q*v.H/1000*Math.max(.3,v.et*TK()[0]*(1-TK()[1]*(q/v.Qd-1)**2)));
return C("Instrumentos",`<div class="g">${gauge(m.Ph/1000,Math.max(m.Ph/1000,1),"Potencia hidráulica","MW")}${gauge(m.Pm/1000,Math.max(m.Pm/1000,1),"Potencia en el eje","MW","var(--ok)")}${gauge(m.etE*100,100,"Rendimiento actual","%","var(--ac2)")}${gauge(m.nq,500,"Velocidad específica n_q","rpm·kW^½/m^1,25","var(--ac)",0)}</div><p>Caudal en la turbina = río ${F(v.Q,1)} + bombeo ${F(m.Qb,2)} = <b>${F(m.Qt,2)} m³/s</b> · Tipo recomendado: <b>${m.type}</b></p>`)+
C("Rendimiento vs caudal (curva de la turbina)",chart(qs,[{ys:e,c:"var(--ac)"}],[m.Qt,m.etE*100],"Caudal Q (m³/s)","η (%)"))+C("Potencia eléctrica entregable vs caudal",chart(qs,[{ys:p,c:"var(--ok)"}],[m.Qt,m.Pm],"Caudal Q (m³/s)","P eje (MW)"))},
alt(m){const ps=rng(4,48,23).filter((_,i)=>i%1==0).map(x=>2*Math.round(x/2)).filter((x,i,a)=>a.indexOf(x)==i);
return C("Instrumentos",`<div class="g">${gauge(m.ns,1800,"Velocidad síncrona","rpm","var(--ac)",0)}${gauge(m.Sg,200,"Potencia aparente","MVA")}${gauge(m.Ig,10000,"Corriente de línea","A","var(--ac2)",0)}${gauge(m.Pe/1000,Math.max(m.Pe/1000,1),"Potencia activa","MW","var(--ok)")}</div>`)+
C("Velocidad síncrona n = 120·f/p",chart(ps,[{ys:ps.map(p=>120*50/p),c:"var(--ac)",n:"50 Hz"},{ys:ps.map(p=>120*60/p),c:"var(--ac2)",n:"60 Hz"}],[v.p,m.ns],"Número de polos","n (rpm)"))+
C("Rotor y estator",`<svg viewBox="0 0 300 110" width="100%"><circle cx="150" cy="55" r="50" fill="none" stroke="var(--mu)" stroke-width="8"/><g style="transform-origin:150px 55px;animation:sp ${Math.max(60/m.ns*3,.15)}s linear infinite"><circle cx="150" cy="55" r="30" fill="var(--ac)" opacity=".8"/><rect x="146" y="25" width="8" height="60" fill="var(--ac2)"/></g></svg><style>@keyframes sp{to{transform:rotate(360deg)}}</style><div class="eq">Animación proporcional a la velocidad. ${v.p} polos a ${v.f} Hz → ${F(m.ns,0)} rpm</div>`)},
trf(m){const xs=rng(.1,1.2,30),ch=T=>xs.map(x=>{const S=T.Sn*x*m.u.pf,c=T.Pcu/(1/1.15)**2*x*x,l=S/(S+T.Pfe+c)*100;return l});
const col=["var(--ac)","var(--ok)","var(--ac2)"];const T=[m.T1,m.T2,m.T3];
let t=`<tr><th>Bobinado</th><th>Tensión</th><th>I fase (A)</th><th>Sección (mm²)</th><th>Ø (mm)</th><th>Espiras</th><th>Hilos Ø3</th></tr>`;

const m1=R.mot;R.mot=()=>{let h=m1();if(equip.mot!=='induction')h=h.replace('Curva par–velocidad','Curva par–velocidad (referencia de inducción; no aplica a este tipo)');return h};
function VX(m){const f=F,u=m.u,e=equip[tab];
 if(tab==='tur'){const ok=m.type===TN[e];return[["Curva del tipo "+TN[e],"η = η_máx·k₁·[1 − k₂(Q/Qd − 1)²]",`k₁ = ${TK()[0]}; k₂ = ${TK()[1]} → η = ${f(m.etE*100,2)} %`],["Verificación por n_q","n_q = n_s·√P / H^1,25",`n_q = ${f(m.nq,0)} → recomendado ${m.type}; elegida ${TN[e]} ${ok?'✔':'⚠ no coincide'}`],e==='pelton'?["Velocidad del chorro","c = Cv·√(2·g·H)",`c = ${f(.97*Math.sqrt(2*9.81*u.H),1)} m/s`]:e==='francis'?["Ecuación de Euler","g·H·ηh = u₁c_u1 − u₂c_u2","Base del diseño del rodete"]:["Regulación doble","Q = f(distribuidor, álabes)","Los álabes móviles mantienen η alta a carga parcial"]]}
 if(tab==='alt'){const pg=AK().pf?Math.min(u.pf,AK().pf):u.pf;return[["Potencia reactiva","Q = Pₑ·tan φ",`cos φ efectivo = ${f(pg,2)} → Q = ${f(m.Pe*Math.tan(Math.acos(pg)),0)} kvar; S = ${f(m.Sg,0)} kVA`],e==='sync'?["Excitación","E = k·Φ·n","La corriente de campo regula V y Q"]:e==='pm'?["Sin excitatriz","ηg,ef = ηg + 0,8 %",`ηg,ef = ${f(Math.min(.995,u.eg+.008)*100,1)} %; V no regulable por campo`]:["Deslizamiento negativo","n = nₛ·(1+|s|), |s| ≈ 1,5 %",`n = ${f(m.ns*1.015,1)} rpm; absorbe reactivo (cos φ ≤ 0,85), ηg −1 %`]]}
 if(tab==='trf'){const a=TF(u.Vg,u.Vt),b=TF(u.Vd,.38);return[["Factores de pérdidas","P_cu = k_cu·P_cu,nom·(S/Sn)²; P_fe = k_fe·P_fe,nom",`T1: k_cu = ${f(a[0],2)}, k_fe = ${f(a[1],2)} · T3: k_cu = ${f(b[0],2)}, k_fe = ${f(b[1],2)}`],e==='auto'?["Potencia propia","S_p = S·(1 − V_b/V_a)","Solo esa fracción se transforma por inducción. Sin aislamiento galvánico"]:e==='distribution'?["Unidades pequeñas","k_cu = 1,3; k_fe = 1,2","Más pérdidas relativas y mayor regulación"]:["Unidad de potencia","k_cu = k_fe = 1","Referencia de diseño de alto rendimiento"]]}
 if(tab==='lin'){const c=LK();return[["Parámetros equivalentes","R = r·L·k_r; X = x·L·k_x",`R = ${f(u.r*u.L*c.r,2)} Ω; X = ${f(u.x*u.L*c.x,2)} Ω`],["Reactivo capacitivo","Q_c = V²·ω·C·L",`C = ${c.c} µF/km → Q_c = ${f(u.Vt**2*2*Math.PI*u.f*c.c*u.L*1e-6,2)} Mvar`]]}
 if(tab==='mot'){const k=mot(u);return e==='induction'?[["Deslizamiento","s = (nₛ − n)/nₛ",`s = ${f(k.s*100,2)} %`]]:e==='sync'?[["Velocidad fija","n = nₛ = 120·f/p",`n = ${f(k.n,1)} rpm; cos φ = 1 (excitación)`]]:[["Armadura","V = E + Iₐ·Rₐ; E = k·Φ·n",`I = P₁/V = ${f(k.I,1)} A (continua); n = ${f(k.n,0)} rpm`]]}
 if(tab==='bom'){const k=pum(u);return[e==='apoyo'?["Balance de caudal","Q_t = Q_río + Q_bomba",`Q_t = ${f(u.Q,1)} + ${f(u.bp?k.Q/1000:0,2)} = ${f(m.Qt,2)} m³/s`]:["Caudal derivado","Q_turbina = Q_río",`${e==='riego'?'Riego':'Trasiego'}: ${f(u.bp?k.Q:0,0)} L/s fuera de la turbina; P_aux = ${f(m.Paux*1e3,0)} kW`]]}
 if(tab==='car')return[e==='residencial'?["Viviendas equivalentes","N = P_res / (kW/viv)",`N = ${f(m.nh,0)}`]:e==='industrial'?["Potencia en el eje","P_eje = P_ind·ηm",`P_eje = ${f(m.Pmot,0)} kW`]:["Servicios y bombeo","P_serv = P_ind + P_aux",`≈ ${f(m.Pind+m.Paux*1e3,0)} kW`]];
 return[]}
const fp0=formulaPanel;formulaPanel=m=>{const h=fp0(m),it=VX(m);if(!it.length)return h;return h.replace('</div><p class="eq">Las sust',it.map(x=>`<div class="formula-item" style="border-color:var(--ac2)"><b style="color:var(--ac2)">★ ${x[0]}</b><div class="formula-eq">${x[1]}</div><div class="formula-sub">${x[2]}</div></div>`).join('')+'</div><p class="eq">Las sust')};
const g1=R.gen;R.gen=m=>g1(m)+C("Configuración activa · del río a la casa",`<div class="formula-grid">${[["🔄","Motor","mot"],["🚰","Bomba","bom"],["💧","Turbina","tur"],["⚙️","Generador","alt"],["🔼","Transformadores","trf"],["〰️","Línea","lin"],["🏠","Cargas","car"]].map(([i,n,k])=>`<div class="formula-item" style="cursor:pointer" onclick="go('${k}')"><b>${i} ${n}</b>${FAMILY[k].opts[equip[k]]}</div>`).join('')}</div><p class="selector-note">Cada tipo cambia las ecuaciones y los resultados; al elegirlo se cargan valores típicos de esa familia (puede ajustarlos).</p>`);
const go0=go;go=function(t){ipt=null;go0(t)};
/* ---- instrumentos ---- */
let ipt=null,cyc=2;const sy={df:.3,dv:2,ph:30};
const TPT={gen:'gen',tur:'gen',alt:'gen',trf:'t1',lin:'lin',car:'t3',mot:'mot',bom:'bom'};
function pts(m){const u=m.u,mo=mot(u),pm=pum(u).mo;return{gen:["Bornes del generador",u.Vg*1000,m.Ig,u.pf,.4],t1:["Secundario de T1 (alta tensión)",u.Vt*1000,m.I,u.pf,.5],lin:["Final de la línea",u.Vt*1000*(1-m.dVp/100),m.I,u.pf,.6],t3:["Baja tensión (usuarios)",m.Vend,m.Pf*1000/(rad*m.Vend*u.pf),u.pf,1],mot:["Bornes del motor",u.mV,mo.I,mo.pf,.8],bom:["Motor de la bomba",u.mV,pm.I,pm.pf,.8]}}
function grd(){return Array.from({length:7},(_,i)=>`<line class="scope-grid" x1="24" x2="591" y1="${15+i*25}" y2="${15+i*25}"/>`).join('')+Array.from({length:9},(_,i)=>`<line class="scope-grid" x1="${24+i*70.875}" x2="${24+i*70.875}" y1="15" y2="165"/>`).join('')}
function arrow(cx,cy,r,deg,col,w){const a=-deg*Math.PI/180,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);return `<path d="M${cx} ${cy} L${x.toFixed(1)} ${y.toFixed(1)}" stroke="${col}" stroke-width="${w}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${col}"/>`}
function instrumentPanel(m){if(tab==='gui')return '';const u=m.u,PT=pts(m),k=ipt||TPT[tab],[nm,V,I,pf,hk]=PT[k],f=u.f,dc=equip.mot==='dc'&&(k==='mot'||k==='bom'),fi=Math.acos(Math.min(1,pf)),ang=fi*180/Math.PI,S=dc?V*I:rad*V*I,Pw=S*pf,Q=S*Math.sin(fi);let c='',nt='';
 if(instrument==='multimeter'){c=`<div class="instrument-readings">${[[F(V,1)+' V',dc?'Tensión (cc)':'Tensión de línea'],[dc?'—':F(V/rad,1)+' V','Tensión de fase'],[F(I,2)+' A','Corriente'],[F(f,1)+' Hz','Frecuencia'],[F(pf,3),'cos φ'],[F(Pw/1000,2)+' kW','P activa'],[F(Q/1000,2)+' kvar','Q reactiva'],[F(S/1000,2)+' kVA','S aparente']].map(x=>`<div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div>`;nt='Lecturas calculadas por el modelo en el punto elegido: P = √3·V·I·cos φ, Q = √3·V·I·sen φ.'}
 else if(instrument==='oscilloscope'){const pt=(ph,a)=>{let s='';for(let i=0;i<=240;i++)s+=(i?'L':'M')+(24+i*567/240).toFixed(1)+','+(90-a*Math.sin(i/240*cyc*2*Math.PI+ph)).toFixed(1);return s};
  c=`<div class="instrument-screen"><svg viewBox="0 0 620 190"><rect x="24" y="15" width="567" height="150" fill="#0b202b"/>${grd()}<path class="scope-wave" d="${pt(0,52)}"/><path class="scope-wave b" d="${pt(-2.0944,52)}"/><path class="scope-wave c" d="${pt(2.0944,52)}"/><path d="${pt(-fi,34)}" fill="none" stroke="#ff7b7b" stroke-width="2" stroke-dasharray="5 3"/><text x="30" y="11" font-size="10">Va · Vb · Vc (normalizadas) · Ia (rojo)</text><text x="470" y="183" font-size="10" class="dim">${cyc} ciclos · ${F(cyc*1000/f,1)} ms</text></svg></div><div class="instrument-readings"><div><b>${F(V/rad*Math.SQRT2*2,0)} V</b><small>Vpp de fase</small></div><div><b>${F(I*Math.SQRT2,1)} A</b><small>I pico</small></div><div><b>${F(1000/f,2)} ms</b><small>Periodo</small></div><div><b>${F(ang/360*1000/f,2)} ms</b><small>Retardo I respecto a V (φ = ${F(ang,1)}°)</small></div></div><label style="display:block">Ciclos en pantalla <select onchange="cyc=+this.value;draw()">${[1,2,4].map(n=>`<option ${n===cyc?'selected':''}>${n}</option>`).join('')}</select></label>`;nt='Ondas ideales con el desfase de la carga en el punto elegido; no incluyen transitorios.'}
 else if(instrument==='phasor'){c=`<div class="instrument-screen"><svg viewBox="0 0 500 190"><circle cx="155" cy="92" r="70" fill="none" stroke="#31505d"/><path d="M75 92H235M155 12V172" stroke="#31505d"/>${arrow(155,92,70,0,'#58e0b4',3)}${arrow(155,92,70,-120,'#f4b860',3)}${arrow(155,92,70,120,'#73a9ff',3)}${arrow(155,92,50,-ang,'#ff7b7b',4)}<text x="250" y="40" font-size="12">Va = ${F(V/rad,0)} V ∠0°</text><text x="250" y="62" font-size="12">Vb ∠−120° · Vc ∠+120°</text><text x="250" y="88" font-size="12" style="fill:#ff7b7b">Ia = ${F(I,1)} A ∠${F(-ang,1)}°</text><text x="250" y="112" font-size="12">cos φ = ${F(pf,3)}</text><text x="250" y="136" font-size="11" class="dim">Secuencia ABC · ${ang>0.5?'carga inductiva (I atrasa)':'carga resistiva'}</text></svg></div>`;nt='Sistema equilibrado; I en fase A atrasada φ. Para Q capacitiva/adelanto se usaría φ negativo.'}
 else if(instrument==='harmonics'){const s=u.sh,hv=[[1,100],[3,(.3+.01*s)*hk],[5,(.5+.06*s)*hk],[7,(.3+.04*s)*hk],[9,.1*hk],[11,(.15+.02*s)*hk],[13,(.1+.015*s)*hk]],thd=Math.sqrt(hv.slice(1).reduce((a,b)=>a+b[1]**2,0));
  c=`<div class="instrument-screen"><svg viewBox="0 0 560 190"><line x1="35" y1="150" x2="540" y2="150" stroke="#8ba6b0"/>${hv.map((h,i)=>{const x=55+i*70,ht=i?h[1]*10:105;return `<rect x="${x}" y="${150-ht}" width="32" height="${ht}" fill="${i?'#f4b860':'#58e0b4'}"/><text x="${x+16}" y="${145-ht}" font-size="10" text-anchor="middle">${F(h[1],1)}%</text><text x="${x+16}" y="166" font-size="10" text-anchor="middle">h${h[0]}</text>`}).join('')}<text x="35" y="14" font-size="11">Armónicos ampliados ×10 (fundamental a escala)</text></svg></div><div class="instrument-readings"><div><b>${F(thd,2)} %</b><small>THD de tensión estimada</small></div><div><b>${thd<(V<1000?8:5)?'Dentro':'Fuera'}</b><small>Ref. orientativa ${V<1000?8:5} % (IEEE 519)</small></div></div>`;nt='Modelo didáctico: el contenido armónico crece con la demanda industrial (convertidores, rectificadores) y es mayor en el punto de carga. No es un cálculo de flujo armónico.'}
 else{const df=sy.df,ok=Math.abs(df)<=.1&&Math.abs(sy.dv)<=5&&(Math.abs(df)>.02||Math.abs(sy.ph)<=10),dur=Math.max(.5,Math.min(20,1/Math.max(Math.abs(df),.02))),mv=Math.abs(df)>.02;
  const sl=(l,k2,a,b,st)=>`<label style="display:block">${l}: <b>${sy[k2]}</b><input type="range" min="${a}" max="${b}" step="${st}" value="${sy[k2]}" onchange="sy.${k2}=+this.value;draw()"></label>`;
  c=`<div class="instrument-screen"><svg viewBox="0 0 420 190"><circle cx="120" cy="92" r="67" fill="none" stroke="#31505d" stroke-width="2"/><path d="M120 25V35" stroke="#58e0b4" stroke-width="4"/><g style="transform-origin:120px 92px;${mv?`animation:${df>0?'syncCW':'syncCCW'} ${dur}s linear infinite`:`transform:rotate(${sy.ph}deg)`}"><path d="M120 92V32" stroke="#f4b860" stroke-width="4"/><circle cx="120" cy="32" r="5" fill="#f4b860"/></g><text x="215" y="50" font-size="13">Red: ${F(f,2)} Hz</text><text x="215" y="72" font-size="13">Gen.: ${F(f+df,2)} Hz (${F(120*(f+df)/u.p,1)} rpm)</text><text x="215" y="94" font-size="12">ΔV = ${sy.dv} % · Δφ = ${mv?'giratorio':sy.ph+'°'}</text><circle cx="225" cy="125" r="9" fill="${ok?'#58e0b4':'#ff7b7b'}"/><text x="242" y="129" font-size="12">${ok?'Condiciones para cerrar':'No cerrar el interruptor'}</text></svg></div>${sl('Δf generador − red (Hz)','df',-1,1,.05)}${sl('ΔV (%)','dv',-10,10,1)}${sl('Δφ estático (°)','ph',-90,90,5)}`;nt='Aguja a las 12 y quieta = fase coincide. Si gira horario, el generador va más rápido; antihorario, más lento. Cierre con Δf ≤ 0,1 Hz, ΔV ≤ 5 % y ángulo ≲ 10°. Verifique también la secuencia de fases.'}
 const tabs=[['multimeter','Multímetro'],['oscilloscope','Osciloscopio'],['phasor','Fasores'],['harmonics','Armónicos'],['sync','Sincronoscopio']];
 return `<div class="instrument-card"><div class="instrument-head"><h2>🧪 Banco de instrumentos virtuales</h2><select aria-label="Punto de medida" onchange="ipt=this.value;draw()">${Object.entries(PT).map(([a,b])=>`<option value="${a}" ${a===k?'selected':''}>📍 ${b[0]}</option>`).join('')}</select></div><div class="instrument-tabs">${tabs.map(([a,t])=>`<button class="${instrument===a?'active':''}" onclick="instrument='${a}';draw()">${t}</button>`).join('')}</div>${c}<p class="selector-note">${nt}</p></div>`}
go("gen");
</script></body></html>
