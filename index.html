<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de control: del río a la casa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f5;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#d9dee5;--ac:#0b6bcb;--ac2:#d9480f;--ok:#2b8a3e;--w:#1c7ed6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161c24;--tx:#e6ebf1;--mu:#93a1b3;--bd:#2b3644;--ac:#5aa9ff;--ac2:#ff8f5a;--ok:#69db7c;--w:#4dabf7}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161c24;--tx:#e6ebf1;--mu:#93a1b3;--bd:#2b3644;--ac:#5aa9ff;--ac2:#ff8f5a;--ok:#69db7c;--w:#4dabf7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:10px 16px 0;background:var(--card);border-bottom:1px solid var(--bd)}h1{font-size:18px;margin:0 0 8px}
nav{display:flex;gap:4px;overflow-x:auto}nav button{border:0;background:none;color:var(--mu);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{display:grid;grid-template-columns:260px 1fr;gap:14px;padding:14px;max-width:1300px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px}
h2{font-size:13px;margin:0 0 6px;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
label{display:grid;grid-template-columns:1fr auto;font-size:12px;margin-top:8px;color:var(--mu)}label b{color:var(--tx)}
input[type=range]{width:100%;grid-column:1/3;accent-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gauge{text-align:center}.gauge svg{width:100%;max-width:170px}.gauge small{color:var(--mu);display:block}
svg text{fill:var(--tx);font-family:inherit}.mu{fill:var(--mu)!important}
.flow{stroke:var(--w);stroke-width:3;stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}
.node{cursor:pointer}.node rect{fill:var(--card);stroke:var(--ac);stroke-width:1.5}.node:hover rect{fill:var(--bg)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:4px 7px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu)}
.eq{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--mu);line-height:1.7}.warn{color:var(--ac2);font-weight:600}
</style></head><body>
<header><h1>⚡ Tablero de control · del río a la casa</h1><nav id="nav"></nav></header>
<main><aside id="ctl"></aside><section id="view"></section></main>
<script>
const P={Q:["Caudal del río Q (m³/s)",1,200,1,40],Qd:["Caudal de diseño Qd (m³/s)",10,200,1,40],H:["Salto neto H (m)",10,500,1,120],et:["Rend. máx. turbina",.8,.95,.01,.9],
eg:["Rend. generador",.9,.99,.005,.97],f:["Frecuencia (Hz)",50,60,10,60],p:["Polos",4,48,2,12],Vg:["Tensión generador (kV)",6.6,13.8,.1,10.5],pf:["cos φ",.7,1,.01,.9],
Vt:["Transmisión (kV)",66,500,1,220],L:["Longitud línea (km)",5,300,1,80],r:["r (Ω/km)",.03,.2,.01,.07],x:["x (Ω/km)",.3,.45,.01,.4],Vd:["Distribución (kV)",6,33,.1,13.2],
J:["Densidad J (A/mm²)",1.5,5,.1,3],B:["Inducción B (T)",1.2,1.8,.05,1.6],pcu:["Pérd. cobre nom. (%)",.3,1.2,.05,.6],pfe:["Pérd. hierro (%)",.05,.4,.01,.12],uk:["uk (%)",4,15,.5,10],
sh:["Demanda industrial (%)",0,100,5,60],kw:["kW por vivienda",.5,3,.1,1.2],em:["Rend. motor",.85,.97,.01,.93],mP:["Potencia nominal motor (kW)",50,10000,10,1500],mn:["Polos del motor",2,12,2,4],ms:["Deslizamiento nominal (%)",.5,6,.1,1.5],mL:["Carga del motor (% par nominal)",10,120,5,80],mV:["Tensión del motor (V)",220,6600,10,380],pn:["Velocidad de la bomba (rpm)",900,3600,50,1750],pH0:["Altura a caudal cero H0 (m)",20,300,5,60],pQm:["Caudal máx. a H=0 (L/s)",50,10000,50,5000],pHs:["Altura estática del sistema (m)",0,100,1,20],pHf:["Fricción a 100 L/s (m)",.1,50,.1,.2],bp:["Bombeo de apoyo (0 = apagado, 1 = activo)",0,1,1,1]};
const v={};for(const k in P)v[k]=P[k][4];
const TABS=[["gen","📊 Tablero general",["Q","H","Vt","L","sh"]],["tur","💧 Turbina",["Q","Qd","H","et"]],["alt","⚙️ Generador",["f","p","Vg","eg","pf"]],
["trf","🔼 Transformadores",["J","B","pcu","pfe","uk","Vt","Vd"]],["lin","〰️ Línea",["Vt","L","r","x"]],["car","🏠 Cargas",["sh","kw","em"]],["mot","🔄 Motor",["mP","mn","ms","mL","mV","f"]],["bom","🚰 Bomba",["pn","pH0","pQm","pHs","pHf","mV"]],["gui","📝 Guía de laboratorio",[]]];
let tab="gen";const rad=Math.sqrt(3),F=(x,n=2)=>x.toLocaleString("es-PE",{maximumFractionDigits:n,minimumFractionDigits:n});
function trafo(name,Pin,V1,V2,c1,c2,pf){const S=Pin/pf,Sn=S*1.15,ld=S/Sn,Pcu=v.pcu/100*Sn*ld*ld,Pfe=v.pfe/100*Sn,Pout=Pin-Pcu-Pfe,R=v.pcu/100,X=Math.sqrt(Math.max(v.uk**2/1e4-R*R,0)),
reg=(R*pf+X*Math.sqrt(1-pf*pf))*ld,Sk=Sn*1000,Et=.45*Math.sqrt(Sk),Ac=Et/(4.44*v.f*v.B);
const w=(V,c)=>{const I=Sk/(rad*V),Ip=c=="Δ"?I/rad:I,Vp=c=="Δ"?V*1000:V*1000/rad,A=Ip/v.J;return{V,c,I,Ip,N:Vp/Et,A,d:Math.sqrt(4*A/Math.PI),par:Math.ceil(A/7.07)}};
return{name,Pin,Pout,Pcu,Pfe,Sn,reg,Et,Ac,eta:Pout/Pin,a:w(V1,c1),b:w(V2,c2)}}
function M(o={}){const u={...v,...o},pk=u.bp?pum(u):{Q:0,Pin:0},Qb=pk.Q/1000,Qt=u.Q+Qb,Paux=pk.Pin/1000,q=Qt/u.Qd,etE=Math.max(.3,u.et*(1-1.4*(q-1)**2)),Ph=9.81*Qt*u.H/1000,Pm=Ph*etE,Pe=Pm*u.eg,Sg=Pe/u.pf,Ig=Sg*1000/(rad*u.Vg),ns=120*u.f/u.p,nq=ns*Math.sqrt(Pm*1000)/u.H**1.25;
const T1=trafo("T1 elevador",Math.max(Pe-Paux,.01),u.Vg,u.Vt,"Δ","Y",u.pf),R=u.r*u.L,X=u.x*u.L,I=T1.Pout*1000/(rad*u.Vt*u.pf),Pl=3*I*I*R/1e6,dV=rad*I*(R*u.pf+X*Math.sqrt(1-u.pf**2)),dVp=dV/(u.Vt*1000)*100,Pr=T1.Pout-Pl;
const T2=trafo("T2 reductor",Pr,u.Vt,u.Vd,"Y","Δ",u.pf),T3=trafo("T3 distribución",T2.Pout,u.Vd,.38,"Δ","Y",u.pf),Pf=T3.Pout,Pind=Pf*u.sh/100,Pcas=Pf-Pind;
return{u,Qt,Qb,Paux,q,etE,Ph,Pm,Pe,Sg,Ig,ns,nq,T1,T2,T3,I,Pl,dVp,Pr,Pf,Pind,Pcas,nh:Pcas*1000/u.kw,Pmot:Pind*u.em,Vend:(1-T2.reg-T3.reg-dVp/100)*380,eff:Pf/Ph,type:nq<70?"Pelton":nq<400?"Francis":"Kaplan"}}
function gauge(val,max,lab,unit,col="var(--ac)",dec=1){const f=Math.min(Math.max(val/max,0),1);
return`<div class="gauge"><svg viewBox="0 0 120 80"><path d="M10 65A50 50 0 0 1 110 65" fill="none" stroke="var(--bd)" stroke-width="10" stroke-linecap="round"/><path d="M10 65A50 50 0 0 1 110 65" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${f*157.08} 157.08"/><text x="60" y="58" text-anchor="middle" font-size="17" font-weight="700">${F(val,dec)}</text><text x="60" y="74" text-anchor="middle" font-size="9" class="mu">${unit}</text></svg><small>${lab}</small></div>`}
function chart(xs,series,mk,xl,yl,w=520,h=210){const m={l:44,r:12,t:12,b:34},X0=Math.min(...xs),X1=Math.max(...xs);let all=series.flatMap(s=>s.ys);let y0=Math.min(...all,0),y1=Math.max(...all)*1.05;if(y1==y0)y1=y0+1;
const sx=x=>m.l+(x-X0)/(X1-X0||1)*(w-m.l-m.r),sy=y=>h-m.b-(y-y0)/(y1-y0)*(h-m.t-m.b);let s=`<svg viewBox="0 0 ${w} ${h}" width="100%">`;
for(let i=0;i<=4;i++){const y=y0+(y1-y0)*i/4;s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--bd)"/><text x="${m.l-5}" y="${sy(y)+4}" text-anchor="end" font-size="10" class="mu">${F(y,y1>20?0:2)}</text>`;
const x=X0+(X1-X0)*i/4;s+=`<text x="${sx(x)}" y="${h-m.b+14}" text-anchor="middle" font-size="10" class="mu">${F(x,X1>20?0:2)}</text>`}
series.forEach(se=>{s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2.2" points="${xs.map((x,i)=>sx(x)+","+sy(se.ys[i])).join(" ")}"/>`;});
if(mk)s+=`<line x1="${sx(mk[0])}" x2="${sx(mk[0])}" y1="${m.t}" y2="${h-m.b}" stroke="var(--ac2)" stroke-dasharray="4 3"/><circle cx="${sx(mk[0])}" cy="${sy(mk[1])}" r="5" fill="var(--ac2)"/>`;
s+=`<text x="${(w+m.l)/2}" y="${h-4}" text-anchor="middle" font-size="11" class="mu">${xl}</text><text x="10" y="${m.t+4}" font-size="11" class="mu">${yl}</text></svg>`;
if(series.length>1)s+=`<div style="font-size:12px;color:var(--mu)">${series.map(z=>`<span style="color:${z.c}">●</span> ${z.n}`).join(" &nbsp; ")}</div>`;return s}
const rng=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
const C=(t,b)=>`<div class="card"><h2>${t}</h2>${b}</div>`;
function wcirc(T){const col=["var(--ac)","var(--ac2)"];let s=`<svg viewBox="0 0 480 120" width="100%">`;
[[T.a,"Prim."],[T.b,"Sec."]].forEach(([w,l],j)=>{const cx=40+j*0,cy=0});
const items=[[T.a,"Primario"],[T.b,"Secundario"]];items.forEach(([w,l],j)=>{const r=Math.min(w.d*2.2,50),cx=100+j*240;s+=`<circle cx="${cx}" cy="58" r="${r}" fill="${col[j]}" opacity=".8"/><text x="${cx}" y="${58+r+16}" text-anchor="middle" font-size="11">${l}: Ø ${F(w.d,2)} mm · ${F(w.N,0)} esp.</text>`});return s+"</svg>"}
const R={
gen(m){const nodes=[["💧","Río",F(m.Ph)+" MW","tur"],["🌀","Turbina",F(m.Pm)+" MW","tur"],["⚙️","Generador",F(m.Pe)+" MW","alt"],["🔼","T1",F(m.T1.Pout)+" MW","trf"],["〰️","Línea",F(m.Pr)+" MW","lin"],["🔽","T2 / T3",F(m.Pf)+" MW","trf"],["🏠","Usuarios",F(m.Pf)+" MW","car"]];
let d=`<svg viewBox="0 0 900 110" width="100%">`;nodes.forEach((n,i)=>{const x=8+i*127;if(i)d+=`<line class="flow" x1="${x-27}" x2="${x}" y1="45" y2="45"/>`;
d+=`<g class="node" onclick="go('${n[3]}')"><rect x="${x}" y="15" width="100" height="62" rx="8"/><text x="${x+50}" y="38" text-anchor="middle" font-size="18">${n[0]}</text><text x="${x+50}" y="55" text-anchor="middle" font-size="11" font-weight="600">${n[1]}</text><text x="${x+50}" y="70" text-anchor="middle" font-size="11" class="mu">${n[2]}</text></g>`});d+=`<text x="8" y="102" font-size="10" class="mu">Haga clic en una máquina para abrir su pestaña</text></svg>`;
const bars=[["Hidráulica",m.Ph],["Eje turbina",m.Pm],["Generador",m.Pe],["Salida T1",m.T1.Pout],["Tras línea",m.Pr],["Salida T2",m.T2.Pout],["Baja tensión",m.Pf]];
const wf=`<svg viewBox="0 0 520 190" width="100%">${bars.map((b,i)=>{const h=b[1]/m.Ph*130;return`<rect x="${14+i*72}" y="${150-h}" width="52" height="${h}" rx="3" fill="${i==6?"var(--ok)":"var(--ac)"}"/><text x="${40+i*72}" y="${144-h}" text-anchor="middle" font-size="10">${F(b[1],1)}</text><text x="${40+i*72}" y="168" text-anchor="middle" font-size="9" class="mu">${b[0]}</text>`}).join("")}</svg>`;
return C("Diagrama unifilar (animado)",d)+C("Instrumentos",`<div class="g">${gauge(m.Pf,m.Ph,"Potencia al usuario","MW","var(--ok)")}${gauge(m.eff*100,100,"Eficiencia río→usuario","%","var(--ok)")}${gauge(m.Vend,400,"Tensión final BT","V","var(--ac)",0)}${gauge(m.Pl/m.Pr*100,10,"Pérdida en línea","%","var(--ac2)")}</div>`)+C("Cascada de potencia (MW)",wf)+
C("Corriente en cada punto del sistema",cur(m))+(m.dVp>10?`<div class="card warn">⚠ Caída de tensión en la línea &gt; 10 %: suba la tensión de transmisión.</div>`:"")},
tur(m){const qs=rng(.3*v.Qd,1.3*v.Qd,40);const e=qs.map(q=>Math.max(.3,v.et*(1-1.4*(q/v.Qd-1)**2))*100),p=qs.map(q=>9.81*q*v.H/1000*Math.max(.3,v.et*(1-1.4*(q/v.Qd-1)**2)));
return C("Instrumentos",`<div class="g">${gauge(m.Ph,200,"Potencia hidráulica","MW")}${gauge(m.Pm,200,"Potencia en el eje","MW","var(--ok)")}${gauge(m.etE*100,100,"Rendimiento actual","%","var(--ac2)")}${gauge(m.nq,500,"Velocidad específica n_q","rpm·kW^½/m^1,25","var(--ac)",0)}</div><p>Caudal en la turbina = río ${F(v.Q,1)} + bombeo ${F(m.Qb,2)} = <b>${F(m.Qt,2)} m³/s</b> · Tipo recomendado: <b>${m.type}</b></p>`)+
C("Rendimiento vs caudal (curva de la turbina)",chart(qs,[{ys:e,c:"var(--ac)"}],[m.Qt,m.etE*100],"Caudal Q (m³/s)","η (%)"))+C("Potencia eléctrica entregable vs caudal",chart(qs,[{ys:p,c:"var(--ok)"}],[m.Qt,m.Pm],"Caudal Q (m³/s)","P eje (MW)"))},
alt(m){const ps=rng(4,48,23).filter((_,i)=>i%1==0).map(x=>2*Math.round(x/2)).filter((x,i,a)=>a.indexOf(x)==i);
return C("Instrumentos",`<div class="g">${gauge(m.ns,1800,"Velocidad síncrona","rpm","var(--ac)",0)}${gauge(m.Sg,200,"Potencia aparente","MVA")}${gauge(m.Ig,10000,"Corriente de línea","A","var(--ac2)",0)}${gauge(m.Pe,200,"Potencia activa","MW","var(--ok)")}</div>`)+
C("Velocidad síncrona n = 120·f/p",chart(ps,[{ys:ps.map(p=>120*50/p),c:"var(--ac)",n:"50 Hz"},{ys:ps.map(p=>120*60/p),c:"var(--ac2)",n:"60 Hz"}],[v.p,m.ns],"Número de polos","n (rpm)"))+
C("Rotor y estator",`<svg viewBox="0 0 300 110" width="100%"><circle cx="150" cy="55" r="50" fill="none" stroke="var(--mu)" stroke-width="8"/><g style="transform-origin:150px 55px;animation:sp ${Math.max(60/m.ns*3,.15)}s linear infinite"><circle cx="150" cy="55" r="30" fill="var(--ac)" opacity=".8"/><rect x="146" y="25" width="8" height="60" fill="var(--ac2)"/></g></svg><style>@keyframes sp{to{transform:rotate(360deg)}}</style><div class="eq">Animación proporcional a la velocidad. ${v.p} polos a ${v.f} Hz → ${F(m.ns,0)} rpm</div>`)},
trf(m){const xs=rng(.1,1.2,30),ch=T=>xs.map(x=>{const S=T.Sn*x*m.u.pf,c=T.Pcu/(1/1.15)**2*x*x,l=S/(S+T.Pfe+c)*100;return l});
const col=["var(--ac)","var(--ok)","var(--ac2)"];const T=[m.T1,m.T2,m.T3];
let t=`<tr><th>Bobinado</th><th>Tensión</th><th>I fase (A)</th><th>Sección (mm²)</th><th>Ø (mm)</th><th>Espiras</th><th>Hilos Ø3</th></tr>`;
T.forEach(x=>[[x.a,"prim."],[x.b,"sec."]].forEach(([w,l])=>t+=`<tr><td>${x.name} ${l}</td><td>${F(w.V,2)} kV (${w.c})</td><td>${F(w.Ip,1)}</td><td>${F(w.A,1)}</td><td><b>${F(w.d,2)}</b></td><td>${F(w.N,0)}</td><td>${w.par}</td></tr>`));
return C("Instrumentos",`<div class="g">${T.map(x=>gauge(x.eta*100,100,x.name+" · rendimiento","%","var(--ok)",2)).join("")}${T.map(x=>gauge(x.Sn,Math.max(...T.map(y=>y.Sn)),x.name+" · S nominal","MVA")).join("")}</div>`)+
C("Rendimiento vs carga",chart(xs.map(x=>x*100),T.map((x,i)=>({ys:ch(x),c:col[i],n:x.name})),[100/1.15,m.T3.eta*100],"Carga (% de S nominal)","η (%)"))+
C("Diámetro de los bobinados (a escala relativa)",T.map(x=>`<b>${x.name}</b>`+wcirc(x)).join(""))+C("Diseño de bobinados",`<div class="sc"><table>${t}</table></div><div class="eq">E_esp = 0,45·√S(kVA) = ${F(m.T1.Et,0)} / ${F(m.T2.Et,0)} / ${F(m.T3.Et,0)} V/espira<br>A_núcleo = E_esp/(4,44·f·B) = ${F(m.T1.Ac*1e4,0)} / ${F(m.T2.Ac*1e4,0)} / ${F(m.T3.Ac*1e4,0)} cm²<br>N = V_fase/E_esp · A = I_fase/J · d = √(4A/π)</div>`)},
lin(m){const vs=rng(66,500,40);const loss=vs.map(V=>{const k=M({Vt:V});return k.Pl/k.T1.Pout*100}),dv=vs.map(V=>M({Vt:V}).dVp);
return C("Instrumentos",`<div class="g">${gauge(m.I,1500,"Corriente de línea","A","var(--ac)",0)}${gauge(m.Pl,20,"Pérdida de potencia","MW","var(--ac2)")}${gauge(m.dVp,15,"Caída de tensión","%","var(--ac2)")}${gauge(m.Pr,m.T1.Pout,"Potencia recibida","MW","var(--ok)")}</div>`)+
C("Pérdida de potencia (%) vs tensión de transmisión",chart(vs,[{ys:loss,c:"var(--ac2)"}],[v.Vt,m.Pl/m.T1.Pout*100],"Tensión (kV)","Pérdida (%)"))+C("Caída de tensión (%) vs tensión de transmisión",chart(vs,[{ys:dv,c:"var(--ac)"}],[v.Vt,m.dVp],"Tensión (kV)","ΔV (%)"))+
`<div class="card eq">I = S/(√3·V) · P_pérd = 3·I²·r·L · ΔV ≈ √3·I·(R·cosφ + X·senφ)<br>Duplicar la tensión reduce la corriente a la mitad y las pérdidas a la cuarta parte.</div>`},
car(m){const pr=[.45,.4,.38,.37,.4,.5,.65,.75,.7,.65,.65,.68,.72,.7,.68,.7,.78,.9,1,.98,.9,.78,.62,.5],hs=pr.map((_,i)=>i);
return C("Instrumentos",`<div class="g">${gauge(m.nh,Math.max(m.nh,1000)*1.2,"Viviendas atendidas","viv.","var(--ok)",0)}${gauge(m.Pind,m.Pf||1,"Carga industrial","MW","var(--ac)")}${gauge(m.Pmot,m.Pf||1,"Potencia en eje de motores","MW","var(--ok)")}${gauge(m.Pind*1e6/(rad*380*.85),20000,"Corriente de motores (cos φ 0,85)","A","var(--ac2)",0)}</div>`)+
C("Demanda diaria típica vs potencia entregable (MW)",chart(hs,[{ys:pr.map(x=>x*m.Pf),c:"var(--ac2)",n:"Demanda"},{ys:hs.map(()=>m.Pf),c:"var(--ok)",n:"Potencia entregable"}],null,"Hora del día","MW"))}};
const D={...v};
function W(o,f){const s={...v};Object.assign(v,o);try{return f()}finally{Object.assign(v,s)}}
function cur(m){const u=m.u,Rw=[["Generador",u.Vg,m.Ig],["Línea de transmisión",u.Vt,m.I],["Distribución (MT)",u.Vd,m.T2.Pout/u.pf*1000/(rad*u.Vd)],["Baja tensión (BT)",.38,m.T3.Pout/u.pf*1000/(rad*.38)]],mx=Math.log10(Math.max(...Rw.map(r=>r[2])));
return`<div class="sc"><table><tr><th>Punto</th><th>Tensión (kV)</th><th>Corriente de línea (A)</th><th>Escala log</th></tr>${Rw.map(r=>`<tr><td>${r[0]}</td><td>${F(r[1],2)}</td><td><b>${F(r[2],0)}</b></td><td style="width:40%"><div style="height:10px;border-radius:5px;background:var(--ac);width:${Math.max(Math.log10(r[2])/mx*100,3)}%"></div></td></tr>`).join("")}</table></div><div class="eq">I = S/(√3·V): al subir la tensión, la corriente baja y la potencia es casi la misma.</div>`}
function mot(u){const ns=120*u.f/u.mn,sn=u.ms/100,lam=2.5,sk=sn*(lam+Math.sqrt(lam*lam-1)),Tn=u.mP*1000/(2*Math.PI*ns*(1-sn)/60),L=u.mL/100,TL=L*Tn,Tmax=lam*Tn,le=Tmax/TL,s=le>=1?sk*(le-Math.sqrt(le*le-1)):sk,Ps=TL*2*Math.PI*ns*(1-s)/60/1000,Pin=Ps+Ps*s/(1-s)+.02*u.mP+.025*u.mP*L*L,pf=Math.min(.92,.3+.65*L),I=Pin*1000/(rad*u.mV*pf),In=u.mP*(1+sn/(1-sn)+.045)*1000/(rad*u.mV*.92);return{ns,sk,Tn,Tmax,TL,s,n:ns*(1-s),Ps,Pin,eta:Ps/Pin,pf,I,Ist:6*In}}
function pum(u){const r=u.pn/1750,H0=u.pH0*r*r,Qm=u.pQm*r,Hs=u.pHs,kf=u.pHf,Q=H0>Hs?Math.sqrt((H0-Hs)/(H0/(Qm*Qm)+kf/1e4)):0,H=Hs+kf*Q*Q/1e4,Qb=.55*Qm,eta=Math.max(.05,.8*(1-((Q-Qb)/Qb)**2)),Ph=9.81*Q/1000*H,Ps=Ph/eta,Lm=Math.min(120,Math.max(5,Ps/u.mP*100)),mo=mot({...u,mL:Lm}),Pin=mo.Pin;return{H0,Qm,Hs,kf,Q,H,Qb,eta,Ph,Ps,Pin,Lm,mo,I:mo.I}}
R.mot=()=>{const k=mot(v),xs=rng(.005,1,60),Tq=xs.map(s=>2*k.Tmax/(s/k.sk+k.sk/s)),ls=rng(10,120,23),Ic=ls.map(L=>mot({...v,mL:L}).I);
return C("Instrumentos",`<div class="g">${gauge(k.n,k.ns,"Velocidad del rotor","rpm","var(--ac)",0)}${gauge(k.TL,k.Tmax,"Par de carga","N·m","var(--ok)",0)}${gauge(k.I,k.Ist,"Corriente de línea","A","var(--ac2)",0)}${gauge(k.eta*100,100,"Rendimiento","%","var(--ok)")}${gauge(k.pf,1,"cos φ","","var(--ac)",2)}${gauge(k.s*100,10,"Deslizamiento","%","var(--ac2)",2)}</div><p>n síncrona ${F(k.ns,0)} rpm · Par nominal ${F(k.Tn,0)} N·m · Par máximo ${F(k.Tmax,0)} N·m · Corriente de arranque ≈ ${F(k.Ist,0)} A (6·In) · Potencia eléctrica de entrada ${F(k.Pin,1)} kW</p>`)+C("Curva par–velocidad",chart(xs.map(s=>k.ns*(1-s)),[{ys:Tq,c:"var(--ac)"}],[k.n,k.TL],"Velocidad (rpm)","Par (N·m)"))+C("Corriente vs carga del motor",chart(ls,[{ys:Ic,c:"var(--ac2)"}],[v.mL,k.I],"Carga (% del par nominal)","I (A)"))+C("Ecuaciones",`<div class="eq">n_s = 120·f/p · s = (n_s − n)/n_s<br>T = 2·T_max/(s/s_k + s_k/s) (Kloss) · P_eje = T·ω<br>P_ent = P_eje + P_cu,rotor + P_cu,estator + P_fijas<br>I = P_ent/(√3·V·cosφ)</div>`)};
R.bom=()=>{const k=pum(v),xs=rng(0,k.Qm*1.05,40),Hp=xs.map(q=>Math.max(0,k.H0*(1-(q/k.Qm)**2))),Hy=xs.map(q=>k.Hs+k.kf*q*q/1e4),E=xs.map(q=>Math.max(0,.8*(1-((q-k.Qb)/k.Qb)**2))*100),mx=Math.max(k.Ps*1.5,1);
return C("Instrumentos",`<div class="g">${gauge(k.Q,k.Qm,"Caudal","L/s","var(--ac)",0)}${gauge(k.H,k.H0,"Altura manométrica","m","var(--ok)")}${gauge(k.eta*100,100,"Rendimiento","%","var(--ok)")}${gauge(k.Ps,mx,"Potencia en el eje","kW","var(--ac2)",0)}${gauge(k.I,Math.max(k.I*1.5,1),"Corriente del motor","A","var(--ac2)",0)}</div>${k.Q==0?'<p class="warn">La bomba no vence la altura estática: aumente H0 o la velocidad.</p>':""}`)+C("Curva de la bomba y curva del sistema (punto de operación)",chart(xs,[{ys:Hp,c:"var(--ac)",n:"Bomba H(Q)"},{ys:Hy,c:"var(--ok)",n:"Sistema H(Q)"}],[k.Q,k.H],"Caudal (L/s)","H (m)"))+C("Rendimiento vs caudal",chart(xs,[{ys:E,c:"var(--ac2)"}],[k.Q,k.eta*100],"Caudal (L/s)","η (%)"))+C("Ecuaciones",`<div class="eq">Sistema: H = H_est + K·Q² · P_hid = ρ·g·Q·H · P_eje = P_hid/η<br>Semejanza: Q₂/Q₁ = n₂/n₁ · H₂/H₁ = (n₂/n₁)² · P₂/P₁ = (n₂/n₁)³<br>Motor eléctrico: I = P_eje/(η_m·√3·V·cosφ)</div>`)};
const tb=(h,rw)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rw.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`;
const BTN='style="padding:6px 12px;border-radius:6px;border:1px solid var(--ac);background:var(--card);color:var(--ac);cursor:pointer"';
const PR=[
{t:"Práctica 1. Balance de energía del sistema",tab:"gen",o:{},obj:"Verificar P = ρ·g·Q·H y calcular el rendimiento de cada etapa.",st:["Cargue los parámetros base.","Anote la potencia en cada punto del Tablero general.","Calcule a mano P_hid y compare (error < 2 %).","Calcule el rendimiento de turbina, generador, T1, línea, T2 y T3, y el global."],ref:()=>W(D,()=>{const m=M();return tb(["Punto","P (MW)"],[["Hidráulica",F(m.Ph)],["Eje turbina",F(m.Pm)],["Generador",F(m.Pe)],["Salida T1",F(m.T1.Pout)],["Tras línea",F(m.Pr)],["Baja tensión",F(m.Pf)],["Eficiencia global",F(m.eff*100,1)+" %"]])})},
{t:"Práctica 2. Por qué se transmite en alta tensión",tab:"lin",o:{},obj:"Relacionar tensión, corriente y pérdidas.",st:["En la pestaña Línea fije Vt = 66, 132, 220 y 500 kV.","Registre corriente, pérdida (%) y caída de tensión (%).","Compruebe que I·V es casi constante y que las pérdidas decrecen como 1/V².","Discuta el costo de aislamiento frente al ahorro en pérdidas."],ref:()=>W(D,()=>tb(["Vt (kV)","I (A)","Pérdida (%)","ΔV (%)"],[66,132,220,500].map(V=>{const m=M({Vt:V});return[V,F(m.I,0),F(m.Pl/m.T1.Pout*100),F(m.dVp)]})))},
{t:"Práctica 3. Diseño de bobinados",tab:"trf",o:{},obj:"Ver cómo J y B determinan diámetro y número de espiras.",st:["En Transformadores fije J = 2, 3 y 4 A/mm².","Anote el diámetro y las espiras de cada bobinado.","Compruebe que Ø es proporcional a 1/√J.","Repita variando B (1,4 / 1,6 / 1,8 T) y explique el efecto sobre el núcleo y las espiras."],ref:()=>tb(["J (A/mm²)","Ø T1 prim. (mm)","Ø T1 sec. (mm)","Ø T3 sec. (mm)","Espiras T1 sec."],[2,3,4].map(J=>W({...D,J},()=>{const m=M();return[J,F(m.T1.a.d),F(m.T1.b.d),F(m.T3.b.d),F(m.T1.b.N,0)]})))},
{t:"Práctica 4. Motor de inducción",tab:"mot",o:{},obj:"Estudiar velocidad, corriente, rendimiento y cos φ según la carga.",st:["En Motor fije la carga en 25, 50, 80 y 100 %.","Registre velocidad, par, corriente, rendimiento y cos φ.","Verifique n = (120·f/p)·(1 − s).","Observe la corriente de arranque (≈ 6·In) y el par máximo en la curva."],ref:()=>tb(["Carga (%)","n (rpm)","Par (N·m)","I (A)","η (%)","cos φ"],[25,50,80,100].map(L=>W({...D,mL:L},()=>{const k=mot(v);return[L,F(k.n,0),F(k.TL,0),F(k.I,0),F(k.eta*100,1),F(k.pf,2)]})))},
{t:"Práctica 5. Bomba: punto de operación y leyes de semejanza",tab:"bom",o:{pHs:0},obj:"Hallar el punto de operación y comprobar Q ∝ n, H ∝ n², P ∝ n³.",st:["En Bomba deje la altura estática en 0 m y fije n = 1450, 1750 y 2100 rpm.","Anote Q, H, potencia en el eje y corriente del motor.","Calcule las razones Q₂/Q₁, H₂/H₁ y P₂/P₁ y compárelas con (n₂/n₁), (n₂/n₁)² y (n₂/n₁)³.","Suba la altura estática a 30 m y explique por qué las leyes ya no se cumplen exactamente."],ref:()=>tb(["n (rpm)","Q (L/s)","H (m)","P eje (kW)","I motor (A)"],[1450,1750,2100].map(n=>W({...D,pHs:0,pn:n},()=>{const k=pum(v);return[n,F(k.Q,0),F(k.H,1),F(k.Ps,0),F(k.I,0)]})))}];
function ld(i){Object.assign(v,D,PR[i].o);go(PR[i].tab)}
R.gui=()=>C("Cómo usar esta guía","<p>Cada práctica lleva un objetivo, pasos y un botón que carga los parámetros iniciales. Registre sus resultados en su cuaderno o informe y compárelos con la referencia (<i>Resultados de referencia</i>, para el docente). Error aceptable: menos de 5 %.</p>")+PR.map((p,i)=>C(p.t,`<p><b>Objetivo:</b> ${p.obj}</p><ol>${p.st.map(s=>`<li>${s}</li>`).join("")}</ol><button ${BTN} onclick="ld(${i})">Cargar parámetros y abrir pestaña</button><details style="margin-top:8px"><summary>Resultados de referencia (docente)</summary>${p.ref()}</details>`)).join("")+C("Informe final","<p>Entregue: tablas de datos de cada práctica, gráficos obtenidos, cálculo manual de al menos un punto por práctica, porcentaje de error y conclusiones sobre cómo cada máquina influye en el rendimiento global.</p>");
TABS.length=0;TABS.push(["gen","📊 Tablero general",["Q","H","Vt","L","sh","bp"]],["mot","1 · 🔄 Motor",["mP","mn","ms","mL","mV","f"]],["bom","2 · 🚰 Bomba",["bp","pn","pH0","pQm","pHs","pHf","mP","mV"]],["tur","3 · 💧 Turbina",["Q","Qd","H","et","bp"]],["alt","4 · ⚙️ Generador",["f","p","Vg","eg","pf"]],["trf","5 · 🔼 Transformadores",["J","B","pcu","pfe","uk","Vt","Vd"]],["lin","6 · 〰️ Línea",["Vt","L","r","x"]],["car","7 · 🏠 Cargas",["sh","kw","em"]],["gui","📝 Guía de laboratorio",[]]);
function dia(m){const N=[["🔄","Motor",F(m.Paux*1e3,0)+" kW","mot",8,8],["🚰","Bomba",F(m.Qb*1e3,0)+" L/s","bom",128,8],["💧","Río",F(v.Q,1)+" m³/s","tur",128,86],["🌀","Turbina",F(m.Pm)+" MW","tur",258,47],["⚙️","Generador",F(m.Pe)+" MW","alt",378,47],["🔼","T1",F(m.T1.Pout)+" MW","trf",498,47],["〰️","Línea",F(m.Pr)+" MW","lin",618,47],["🔽","T2 / T3",F(m.Pf)+" MW","trf",738,47],["🏠","Usuarios",F(m.Pf)+" MW","car",858,47]];
const Ls=[[104,36,128,36],[224,36,258,66],[224,114,258,86],...[3,4,5,6,7].map(i=>[N[i][4]+96,75,N[i+1][4],75])];
return`<svg viewBox="0 0 960 150" width="100%">${Ls.map(l=>`<line class="flow" x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}"/>`).join("")}${N.map(n=>`<g class="node" onclick="go('${n[3]}')"><rect x="${n[4]}" y="${n[5]}" width="96" height="56" rx="8"/><text x="${n[4]+48}" y="${n[5]+20}" text-anchor="middle" font-size="16">${n[0]}</text><text x="${n[4]+48}" y="${n[5]+36}" text-anchor="middle" font-size="11" font-weight="600">${n[1]}</text><text x="${n[4]+48}" y="${n[5]+49}" text-anchor="middle" font-size="10" class="mu">${n[2]}</text></g>`).join("")}<text x="8" y="146" font-size="10" class="mu">El motor se alimenta de la propia generación (autoconsumo). Haga clic en una máquina para abrir su pestaña.</text></svg>`}
const g0=R.gen;R.gen=m=>{const m0=M({bp:0}),gan=(m.Pe-m.Paux)-m0.Pe;return g0(m).replace(/<div class="card"><h2>Diagrama unifilar \(animado\)<\/h2>[\s\S]*?<\/svg><\/div>/,()=>`<div class="card"><h2>Diagrama de flujo: caudal y energía (animado)</h2>${dia(m)}</div>`)+C("Bombeo de apoyo",v.bp?`<p>Caudal en la turbina: río ${F(v.Q,1)} + bombeo ${F(m.Qb,2)} = <b>${F(m.Qt,2)} m³/s</b>. El motor consume ${F(m.Paux*1e3,0)} kW (${F(m.Paux/m.Pe*100,1)} % de la generación). Ganancia neta de potencia frente a no bombear: <b>${F(gan*1e3,0)} kW</b>.</p>`:"<p>Bombeo apagado (bp = 0): la turbina trabaja solo con el caudal del río.</p>")};
const b0=R.bom;R.bom=()=>{const k=pum(v);return C("Acople motor–bomba",`<p>La bomba exige ${F(k.Ps,0)} kW en el eje: el motor trabaja al <b>${F(k.Lm,0)} %</b> de su potencia nominal (${v.mP} kW), con ${F(k.mo.I,0)} A, η ${F(k.mo.eta*100,1)} % y consume ${F(k.Pin,0)} kW eléctricos. Caudal enviado a la turbina: <b>${F(k.Q,0)} L/s</b>.</p>${k.Lm>=120?'<p class="warn">Motor sobrecargado: aumente su potencia nominal.</p>':''}`)+b0()};
const m0r=R.mot;R.mot=()=>{const k=pum(v);return C("Función en la línea",`<p>Este motor acciona la bomba que refuerza el caudal de la turbina. Con la bomba acoplada trabaja al <b>${F(k.Lm,0)} %</b> de su potencia nominal. Aquí puede estudiarlo por separado variando la carga.</p>`)+m0r()};
PR.push({t:"Práctica 6. Bombeo de apoyo a la turbina",tab:"bom",o:{Q:10,Qd:12,bp:1},obj:"Evaluar si el caudal bombeado compensa la energía que consume el motor.",st:["Cargue los parámetros (río en estiaje: 10 m³/s, Qd = 12).","Con el bombeo apagado (bp = 0) anote el caudal y la potencia que llega a T1.","Active el bombeo y anote el caudal adicional, el consumo del motor y la potencia neta en T1.","Calcule la ganancia neta y discuta cuándo conviene bombear (altura de la bomba frente al salto de la turbina).","Aumente la altura estática de la bomba y encuentre el punto en que deja de convenir."],ref:()=>tb(["Bombeo","Q turbina (m³/s)","P generador (MW)","Consumo motor (MW)","P neta a T1 (MW)"],[0,1].map(b=>W({...D,Q:10,Qd:12,bp:b},()=>{const m=M();return[b?"Activo":"Apagado",F(m.Qt,2),F(m.Pe),F(m.Paux),F(m.T1.Pin)]})))});
function go(t){tab=t;nav();ctlr();draw()}
function nav(){document.getElementById("nav").innerHTML=TABS.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}
function ctlr(){const keys=TABS.find(t=>t[0]==tab)[2];document.getElementById("ctl").innerHTML=`<div class="card"><h2>Parámetros</h2>${keys.map(k=>`<label><span>${P[k][0]}</span><b id="o_${k}">${v[k]}</b><input type="range" id="${k}" min="${P[k][1]}" max="${P[k][2]}" step="${P[k][3]}" value="${v[k]}"></label>`).join("")}</div>`}
document.getElementById("ctl").addEventListener("input",e=>{v[e.target.id]=+e.target.value;document.getElementById("o_"+e.target.id).textContent=e.target.value;draw()});
function draw(){document.getElementById("view").innerHTML=R[tab](M())}
go("gen");
</script></body></html>
